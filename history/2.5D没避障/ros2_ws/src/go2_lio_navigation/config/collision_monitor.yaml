collision_monitor:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom_lio
    # A freshness gate forwards /cmd_vel_safe to /cmd_vel_guarded for go2_base.
    cmd_vel_in_topic: /cmd_vel
    cmd_vel_out_topic: /cmd_vel_safe
    transform_tolerance: 0.2
    source_timeout: 0.5
    # /scan_safety is already in base_link. Humble's inter-time TF lookup
    # waits for a future LIO pose on every command and throttled this lane to
    # ~6 Hz. The final gate independently checks the actual scan age, measured
    # ego motion, world-frame retained points and the age-extended braking arc.
    base_shift_correction: false
    stop_pub_timeout: 1.0
    polygons: [EmergencyStop, FootprintApproach]
    EmergencyStop:
      # Physical body: +/-0.38 x +/-0.15 m; no extra padding.
      # The final gate checks the speed-dependent braking arc beyond it,
      # rather than blocking a safe away-turn with a larger fixed rectangle.
      type: polygon
      points: [0.38, 0.15, 0.38, -0.15, -0.38, -0.15, -0.38, 0.15]
      action_type: stop
      # Humble uses count > max_points for STOP: one chair-leg return stops.
      max_points: 0
      visualize: true
      polygon_pub_topic: /safety/stop_zone
      # Point experiment: no polygon area. Launch derives both flags from
      # physical_safety.collision_model and restores these in rectangle mode.
      enabled: false
    FootprintApproach:
      type: polygon
      action_type: approach
      # Humble polygon-approach reads this topic, not the static points parameter.
      footprint_topic: /safety/body_footprint
      time_before_collision: 1.0
      simulation_time_step: 0.05
      # Keep >=1 here: Humble APPROACH treats count >= max_points as an
      # immediate collision, so zero would stop even with an empty scene.
      # The downstream turn gate separately checks every single future return.
      max_points: 1
      visualize: false
      enabled: false
    observation_sources: [scan]
    scan:
      type: scan
      # Fresh HAP projection bypasses FAST-LIO processing for emergency response.
      topic: /scan_safety
      enabled: true
