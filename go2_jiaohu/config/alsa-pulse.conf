# 邦邦 UI 只通过 PulseAudio 使用系统设置中的默认输入/输出。
# 避免 PortAudio 枚举 Jetson 上大量不存在的 legacy PCM 名称并输出警告。
pcm.pulse {
    type pulse
}

ctl.pulse {
    type pulse
}

# PortAudio 会探测 /proc/asound/cards 中的硬件 PCM 和控制接口；保留这两个基础
# 定义可完成正常探测，语音控制器仍会按名称只选择 pulse 输入。
pcm.hw {
    @args [ CARD DEV SUBDEV ]
    @args.CARD {
        type string
        default "0"
    }
    @args.DEV {
        type integer
        default 0
    }
    @args.SUBDEV {
        type integer
        default -1
    }
    type hw
    card $CARD
    device $DEV
    subdevice $SUBDEV
}

ctl.hw {
    @args [ CARD ]
    @args.CARD {
        type string
        default "0"
    }
    type hw
    card $CARD
}

pcm.!default {
    type pulse
}

ctl.!default {
    type pulse
}
